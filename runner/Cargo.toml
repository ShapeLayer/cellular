[package]
name = "cellular"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
dirs = "6.0.0"
gix = { version = "0.86.0", default-features = false, features = ["revision", "max-performance-safe", "sha1"] }
globset = "0.4.20"
md-5 = "0.11.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
unicode-width = "0.2.2"
uuid = { version = "1.24.1", features = ["v4"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# Free space on the volume holding the index; only the unix path needs it,
# Windows reads it through kernel32 directly.
[target.'cfg(unix)'.dependencies]
libc = "0.2.189"
